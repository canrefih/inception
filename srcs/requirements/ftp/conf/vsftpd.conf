listen=YES
listen_ipv6=NO

anonymous_enable=NO
local_enable=YES
write_enable=YES

local_umask=022

dirmessage_enable=YES
xferlog_enable=YES
xferlog_file=/var/log/vsftpd.log
xferlog_std_format=YES

idle_session_timeout=600
data_connection_timeout=120

chroot_local_user=YES
allow_writeable_chroot=YES

local_root=/home/ftpuser/wordpress

pasv_enable=YES
pasv_min_port=50000
pasv_max_port=50100

seccomp_sandbox=NO
